# TurboMusic server.   Start it:                          docker compose up -d
#                      Start it with a Cloudflare tunnel: docker compose --profile tunnel up -d     (needs TUNNEL_TOKEN in .env)
#                      Update it:                         docker compose pull && docker compose up -d
# Settings go in a file called .env next to this one (see .env.example).
services:
  turbomusic:
    image: ghcr.io/turbonzl/turbomusic:latest
    # to build it yourself instead of pulling:  build: .
    restart: unless-stopped
    environment:
      # The access token the apps use. Blank = one is made on the first start and kept in the data folder (docker compose logs shows it).
      TURBOMUSIC_TOKEN: ${TURBOMUSIC_TOKEN:-}
      # Optional YouTube cookies (a file in the data folder) when YouTube asks the server to prove it is not a bot.
      # TURBOMUSIC_YTDLP_COOKIES: /data/cookies.txt
    volumes:
      # Where the library lives: the database, the music, the covers. A folder on a big drive is the usual choice.
      - ${TURBOMUSIC_DATA:-./data}:/data
    ports:
      # TURBOMUSIC_BIND=127.0.0.1 keeps it reachable from this machine only (when only the tunnel should reach it).
      - "${TURBOMUSIC_BIND:-0.0.0.0}:47813:47813"

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      - turbomusic
