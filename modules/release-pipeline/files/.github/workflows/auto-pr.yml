# Opens a pull request for every branch that is pushed (other than main), so merging it is the only step left.
# Needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
name: Open pull request
on:
  push:
    branches-ignore: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Create the pull request if the branch has none
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          open=$(gh pr list --head "$BRANCH" --state open --json number --jq length)
          if [ "$open" != "0" ]; then echo "A pull request is already open for $BRANCH."; exit 0; fi
          git fetch origin main
          if [ -z "$(git log origin/main..HEAD --oneline)" ]; then echo "Nothing new compared with main."; exit 0; fi
          title=$(git log -1 --format=%s)
          { echo "Opened automatically for \`$BRANCH\`. Merging it builds and publishes a new release (Android APK and desktop installers)."; echo; echo "Changes:"; git log origin/main..HEAD --format='- %s' | head -30; } > body.md
          gh pr create --base main --head "$BRANCH" --title "$title" --body-file body.md
