# TurboKeep. Start it:               docker compose up -d
# Start it with a Cloudflare tunnel: docker compose --profile tunnel up -d     (needs TUNNEL_TOKEN in .env, see docs/guides/CLOUDFLARE_TUNNEL.md)
# The port on THIS machine is TURBOKEEP_PORT (default 47901): every program on a machine needs its own port, see the engine's docs/SERVER_APPS.md.
services:
  turbokeep:
    image: ghcr.io/turbonzl/turbokeep:latest
    # to build it yourself instead of pulling:  build: .
    restart: unless-stopped
    environment:
      # Behind a tunnel or reverse proxy (the default): use X-Forwarded-Proto/Host and CF-Connecting-IP. Set to false when it faces the network directly.
      TURBOKEEP_TRUST_PROXY: "true"
      # Let anyone who can reach the page create an account. Off: only the first account, created on first run.
      TURBOKEEP_ALLOW_SIGNUP: "false"
      # Optional: skip the setup screen by creating the first account from these.
      # TURBOKEEP_ADMIN_USER: you
      # TURBOKEEP_ADMIN_PASSWORD: a long password
      # Largest import in MB.
      # TURBOKEEP_MAX_IMPORT_MB: "256"
    volumes:
      - turbokeep-data:/data
    # Reachable on this machine only; the tunnel talks to it over the compose network (always on 8080 INSIDE the container, which clashes with nothing).
    # The left-hand number is the port on this machine: set TURBOKEEP_PORT in .env to move it. To use it on your LAN, drop the "127.0.0.1:".
    ports:
      - "127.0.0.1:${TURBOKEEP_PORT:-47901}:8080"

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # `:-` and not `:?`: compose reads the variable for EVERY service, even one in a profile that is not running, so a required variable
      # stops a plain `docker compose up` with "required variable TUNNEL_TOKEN is missing". Empty is fine until the tunnel profile is used.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - turbokeep

volumes:
  turbokeep-data:
