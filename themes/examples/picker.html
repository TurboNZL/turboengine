<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>turbothemes: the one-tag picker</title>
  <link rel="stylesheet" href="../dist/base.css" />
  <style>body { padding: 1rem; display: grid; gap: 1rem; max-width: 60rem; margin: 0 auto; } h1 { margin: 0; font-size: 1.1rem; }</style>
</head>
<body>
  <h1>The whole install: start() and a tag</h1>
  <div class="card"><turbo-themes-picker variant="tiles" sections="theme,ui,wallpaper,updates"></turbo-themes-picker></div>
  <div class="card"><turbo-themes-picker></turbo-themes-picker></div>
  <turbo-themes-picker floating label="Look"></turbo-themes-picker>
  <script type="module">
    import { start } from '../dist/engine.js';
    start({ persist: true, picker: true, autoUpdate: false });
  </script>
</body>
</html>
